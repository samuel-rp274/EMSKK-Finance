<!DOCTYPE html>
<html lang="id">
<head>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/guard.css">
<script src="assets/js/guard.js" data-level="1"></script>
<link rel="stylesheet" href="assets/css/sidebar.css">
<script src="assets/js/sidebar.js" defer></script>
<link rel="stylesheet" href="assets/css/index.css">
<script src="assets/js/index.js" defer></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMSKK Dashboard</title>

<link rel="icon" href="assets/images/logo.png" type="image/png">
<link rel="manifest" href="assets/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

</head>
<body>
<div class="blob top-left"></div>
<div class="blob bottom-right"></div>

<div class="container">

  <div class="page-header">
    <div>
      <h1><span class="white">EMSKK</span> <span class="gradient">DASHBOARD</span></h1>
      <div class="page-subtitle" id="dateSubtitle">&nbsp;</div>
    </div>
    <div class="freshness"><i data-lucide="refresh-cw"></i><span id="freshnessText">Memuat...</span></div>
  </div>

  <div id="loadingState" class="loading-state">
    <i data-lucide="loader-circle"></i>
    loading EMSKK Portal dashboard...
  </div>

  <div id="contentWrap" style="display:none;">

    <div class="summary-grid">
      <div class="card accent-red summary-card">
        <div class="summary-value mono red" id="totalDuty">0</div>
        <div class="summary-label">Total Sesi Duty</div>
        <div class="summary-week" id="weekRangeA">Minggu ini</div>
      </div>
      <div class="card accent-orange summary-card">
        <div class="summary-value mono orange" id="totalDutyToday">0</div>
        <div class="summary-label">Sesi Duty</div>
        <div class="summary-week">Hari ini</div>
      </div>
      <div class="card accent-green summary-card">
        <div class="summary-value mono green" id="totalInvoice">0</div>
        <div class="summary-label">Total Invoice</div>
        <div class="summary-week" id="weekRangeB">Minggu ini</div>
      </div>
      <div class="card accent-cyan summary-card">
        <div class="summary-value mono cyan" id="totalInvoiceToday">0</div>
        <div class="summary-label">Invoice</div>
        <div class="summary-week">Hari ini</div>
      </div>
      <div class="card accent-purple ems-card">
        <div class="ems-card-header">
          <span class="ems-card-title">Anggota EMS</span>
          <i data-lucide="users" style="width:14px; height:14px; color:var(--accent-purple);"></i>
        </div>
        <div class="ems-rotator">
          <div class="ems-arrow" id="emsPrev"><i data-lucide="chevron-left"></i></div>
          <div class="ems-center">
            <div class="ems-number mono" id="emsNumber">0</div>
            <div class="ems-label" id="emsLabel">–</div>
          </div>
          <div class="ems-arrow" id="emsNext"><i data-lucide="chevron-right"></i></div>
        </div>
        <div class="ems-dots" id="emsDots"></div>
      </div>
    </div>

    <div class="duo-grid">
      <div class="card accent-amber">
        <div class="card-title"><i data-lucide="activity" style="color:var(--accent-amber);"></i> Top Duty Minggu Ini</div>
        <div class="card-sub">total jam</div>
        <div id="topDutyList" class="mono scroll-list"></div>
      </div>

      <div class="card accent-blue">
        <div class="card-title"><i data-lucide="zap" style="color:var(--accent-blue);"></i> Aktivitas Terbaru</div>
        <div class="card-sub">start duty & upload invoice</div>
        <div id="activityList" class="scroll-list"></div>
      </div>
    </div>

    <div class="card accent-rose">
      <div class="card-title"><i data-lucide="image" style="color:var(--accent-rose);"></i> Galeri</div>
      <div class="card-sub">dokumentasi &amp; kegiatan</div>
      <div class="gallery-wrap" id="galleryWrap">
        <div class="loading-state" style="padding:0; height:100%; justify-content:center;">
          <i data-lucide="loader-circle"></i>
          memuat galeri...
        </div>
      </div>
    </div>

  </div>
</div>

<a href="tutorial.html" class="fab-tutorial" id="fabTutorial">
  <i data-lucide="book-open" style="width: 20px; height: 20px;"></i>
</a>
</body>
</html>
