<!DOCTYPE html>
<html lang="id">
<head>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/guard.css">
<script src="assets/js/guard.js" data-level="2"></script>
<script src="assets/js/config.js"></script>
<link rel="stylesheet" href="assets/css/sidebar.css">
<script src="assets/js/sidebar.js" defer></script>
<link rel="stylesheet" href="assets/css/photoupload.css">
<script src="assets/js/photoupload.js" defer></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMSKK Upload Foto</title>

<link rel="icon" href="assets/images/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="blob top-left"></div>
  <div class="blob bottom-right"></div>

  <div class="container">
    <div class="card">
      <div class="card-header-icon"><i data-lucide="image-plus"></i></div>
      <h1><span class="gradient">Upload Foto</span></h1>
      <div class="subtitle">Foto otomatis di-resize &amp; dikompres, langsung tersimpan ke repo</div>

      <div class="mode-toggle" id="modeToggle">
        <button type="button" class="mode-btn active" data-mode="profile"><i data-lucide="user"></i> Foto Profil</button>
        <button type="button" class="mode-btn" data-mode="gallery"><i data-lucide="images"></i> Foto Galeri</button>
      </div>

      <div class="field" id="namaField">
        <label>Pilih Nama</label>
        <select id="namaSelect">
          <option value="">Memuat daftar nama...</option>
        </select>
      </div>

      <div class="field" id="filenameField">
        <label>Nama File (otomatis, boleh diubah)</label>
        <input type="text" id="filenameInput" placeholder="contoh: erza-everdeen.jpg">
        <div id="filenameHint" style="font-size:11px; color:var(--muted-2); margin-top:6px;"></div>
      </div>

      <div class="field">
        <label>Foto</label>
        <div class="dropzone" id="dropzone">
          <i data-lucide="upload-cloud"></i>
          <p>Klik untuk pilih foto, atau drag & drop di sini</p>
          <input type="file" id="fileInput" accept="image/*">
        </div>
        <div class="crop-wrap" id="cropWrap">
          <div class="crop-stage" id="cropStage">
            <img id="cropImgEl" src="" alt="crop">
          </div>
          <div class="crop-controls">
            <i data-lucide="zoom-out"></i>
            <input type="range" id="zoomSlider" min="1" max="3" step="0.02" value="1">
            <i data-lucide="zoom-in"></i>
          </div>
          <div class="crop-hint">Drag foto buat atur posisi, geser slider buat zoom</div>
          <div class="crop-actions">
            <button type="button" class="btn-secondary" id="cropCancelBtn"><i data-lucide="x"></i> Ganti Foto</button>
            <button type="button" class="btn-confirm" id="cropConfirmBtn"><i data-lucide="check"></i> Gunakan Foto Ini</button>
          </div>
        </div>
        <div class="preview-wrap" id="previewWrap">
          <img id="previewImg" class="preview-img" src="" alt="preview">
          <div class="preview-info">
            <div><b id="previewName"></b></div>
            <div id="previewSize"></div>
          </div>
          <button type="button" class="btn-secondary" id="previewResetBtn" style="flex:none; padding:8px 12px;"><i data-lucide="rotate-ccw"></i></button>
        </div>
      </div>

      <button class="btn-submit" id="submitBtn" disabled>
        <i data-lucide="upload"></i> Upload Foto
      </button>

      <div class="status-box" id="statusBox"></div>
    </div>
  </div>
</body>
</html>
