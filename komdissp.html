<!DOCTYPE html>
<html lang="id">
<head>
<script src="assets/js/config.js"></script>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/guard.css">
<script src="assets/js/guard.js" data-level="2"></script>
<link rel="stylesheet" href="assets/css/sidebar.css">
<script src="assets/js/sidebar.js" defer></script>
<link rel="stylesheet" href="assets/css/manualadmin.css">
<link rel="stylesheet" href="assets/css/komdissp.css">
<script src="assets/js/komdissp.js" defer></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMSKK Komdis - Surat Peringatan</title>

<link rel="icon" href="assets/images/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="blob top-left"></div>
  <div class="blob bottom-right"></div>

  <div class="container">

    <div class="card" id="komdisPanel">

      <div class="card-header-icon">
        <i data-lucide="shield-alert"></i>
      </div>

      <h1><span class="white">EMSKK</span> <span class="gradient">SURAT PERINGATAN</span></h1>
      <div class="subtitle">Komdis tool — cari member dan atur status Surat Peringatan (SP)</div>

      <div class="form-group">
        <label>Cari Nama Member</label>
        <input type="text" id="spSearch" placeholder="Ketik minimal 2 huruf nama..." autocomplete="off">
        <div id="spSearchResults" class="search-results hidden"></div>
      </div>

      <div id="spMemberWrap" class="hidden">
        <div class="identity-block">
          <div class="field-label">Member terpilih</div>
          <div class="field-value" id="spName">-</div>
          <div class="field-sub" id="spMeta">-</div>
        </div>

        <form id="spForm">
          <input type="hidden" id="spId">

          <div class="form-group">
            <label>Ket. SP</label>
            <select id="spKetSp">
              <option value="">-</option>
              <option value="SP 1">SP 1</option>
              <option value="SP 2">SP 2</option>
            </select>
          </div>

          <button type="submit">SIMPAN PERUBAHAN SP</button>
          <div id="spStatus" class="status-msg"></div>
        </form>
      </div>

    </div>
  </div>
</body>
</html>
