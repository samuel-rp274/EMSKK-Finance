<!DOCTYPE html>
<html lang="id">
<head>
<script src="assets/js/config.js"></script>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/guard.css">
<script src="assets/js/guard.js" data-level="3"></script>
<link rel="stylesheet" href="assets/css/sidebar.css">
<script src="assets/js/sidebar.js" defer></script>
<link rel="stylesheet" href="assets/css/totalattendance.css">
<script src="assets/js/totalattendance.js" defer></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMSKK Total Attendance Archive</title>

<link rel="icon" href="assets/images/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="blob top-left"></div>
  <div class="blob bottom-right"></div>

  <div class="container">

    <div class="card" id="loginCard">
      <h1>Super Admin Entry</h1>
      <div class="subtitle">Masukkan kredensial keamanan</div>
      <input type="password" id="adminPassword" placeholder="Password Super Admin">
      <button onclick="checkLogin()"><i data-lucide="lock" style="width:16px; height:16px"></i> Masuk</button>
      <div id="loginStatus"></div>
    </div>

    <div class="card hidden" id="adminPanel">
      <div class="card-header-icon">
        <i data-lucide="archive"></i>
      </div>
      <h1><span class="white">EMSKK</span> <span class="gradient">TOTAL ATTENDANCE ARCHIVE</span></h1>
      <div class="subtitle">Super Admin Tool — Total duty seluruh member dengan custom range waktu</div>

      <div class="topbar">
        <input type="date" id="startDate">
        <input type="date" id="endDate">
        <button id="btnGenerate" onclick="generate()">
          <i data-lucide="refresh-cw" id="btnIcon" style="width:14px; height:14px;"></i>
          <span id="btnText">Generate</span>
        </button>        
      </div>

      <div class="info" id="infoText">Silakan masukkan rentang tanggal di atas.</div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width: 80px;">Rank</th>
              <th>Nama</th>
              <th style="width: 180px;">Total Jam</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="3" class="empty-state">Data belum di-generate</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
