<!DOCTYPE html>
<html lang="id">
<head>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/guard.css">
<script src="assets/js/guard.js" data-level="2"></script>
<script src="assets/js/config.js"></script>
<link rel="stylesheet" href="assets/css/sidebar.css">
<script src="assets/js/sidebar.js" defer></script>
<link rel="stylesheet" href="assets/css/rank.css">
<script src="assets/js/rank.js" defer></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMSKK Duty Ranking</title>

<link rel="icon" href="assets/images/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="blob top-left"></div>
  <div class="blob bottom-right"></div>

  <div class="container">

    <div class="card">
      <div class="card-header-icon">
        <i data-lucide="trophy"></i>
      </div>
      <h1><span class="white">EMSKK</span> <span class="gradient">DUTY RANKING</span></h1>

      <div class="topbar">
        <button id="weeklyBtn" class="active" onclick="setMode('weekly')">Weekly</button>
        <button id="monthlyBtn" onclick="setMode('monthly')">Monthly</button>

        <select id="periodSelect" onchange="render()"></select>

        <button id="refreshBtn" onclick="loadData(true)"><i data-lucide="refresh-cw" style="width:14px; height:14px;"></i> Refresh</button>
        <button onclick="exportTXT()"><i data-lucide="download" style="width:14px; height:14px;"></i> Export TXT</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width: 80px;">Rank</th>
              <th>Nama</th>
              <th style="width: 180px;">Total Jam</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="section-title">
      <i data-lucide="user-minus" style="width:14px; height:14px;"></i> Belum Pernah Duty
    </div>

    <div class="table-wrap" style="margin-bottom: 20px;">
      <table>
        <thead>
          <tr>
            <th style="width: 80px;">No</th>
            <th>Nama</th>
          </tr>
        </thead>
        <tbody id="neverDutyTable"></tbody>
      </table>
    </div>
  </div>
</body>
</html>
