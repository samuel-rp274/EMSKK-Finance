<!DOCTYPE html>
<html lang="id">
<head>
<script src="assets/js/config.js"></script>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/guard.css">
<script src="assets/js/guard.js" data-level="1"></script>
<link rel="stylesheet" href="assets/css/sidebar.css">
<script src="assets/js/sidebar.js" defer></script>
<link rel="stylesheet" href="assets/css/attendance.css">
<script src="assets/js/attendance.js" defer></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMSKK Attendance</title>

<link rel="icon" href="assets/images/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="blob top-left"></div>
  <div class="blob bottom-right"></div>

  <div class="container">
    <div class="card">

      <div class="card-header-icon">
        <i data-lucide="clock"></i>
      </div>

      <h1><span class="white">EMSKK</span> <span class="gradient">ATTENDANCE</span></h1>
      <div class="subtitle">Realtime on-duty tracking system</div>

      <div class="clock-box">
        <div class="clock-time" id="clock-time">00:00:00</div>
        <div class="clock-date" id="clock-date">loading...</div>
      </div>

      <div class="identity-block">
        <div class="identity-name-group">
          <div class="field-label">Nama</div>
          <div class="identity-name" id="nama">Memuat...</div>
        </div>
        <div class="identity-cols">
          <div class="field-col">
            <div class="field-label">Jabatan</div>
            <div class="field-value" id="jabatan"></div>
          </div>
          <div class="field-col">
            <div class="field-label">Divisi</div>
            <div class="field-value" id="divisi"></div>
          </div>
        </div>
      </div>

      <button id="duty-btn" class="duty-btn state-start" onclick="handleDutyClick()">START DUTY</button>

      <div id="status" class="status-box badge-off">OFF DUTY</div>
    </div>
  </div>
</body>
</html>
