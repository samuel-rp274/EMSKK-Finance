<!DOCTYPE html>
<html lang="id">
<head>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/guard.css">
<script src="assets/js/guard.js" data-level="1"></script>
<script src="assets/js/config.js"></script>
<link rel="stylesheet" href="assets/css/sidebar.css">
<script src="assets/js/sidebar.js" defer></script>
<link rel="stylesheet" href="assets/css/invoicelog.css">
<script src="assets/js/invoicelog.js" defer></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMSKK Invoice Overview</title>

<link rel="icon" href="assets/images/logo.png" type="image/png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css">
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="blob top-left"></div>
  <div class="blob bottom-right"></div>

  <div class="container">

    <div class="card">
      <div class="card-header-icon">
        <i data-lucide="folder-clock"></i>
      </div>

      <h1><span class="white">EMSKK</span> <span class="gradient">INVOICE OVERVIEW</span></h1>
      <div class="subtitle">Weekly invoice submission summary</div>

      <div class="form-group">
        <select id="searchEMS" placeholder="Cari nama EMS..."></select>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="stat-title">Jumlah Invoice Minggu Ini</div>
          <div class="stat-value" id="jumlahInvoice">0</div>
        </div>
        <div class="stat">
          <div class="stat-title">Total Invoice Minggu Ini</div>
          <div class="stat-value" id="totalGaji">$KK 0</div>
        </div>
        <div class="stat">
          <div class="stat-title">Upload Terakhir</div>
          <div class="stat-value" id="uploadTerakhir">-</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>No</th>
              <th>Tanggal</th>
              <th>Invoice</th>
              <th>Qty</th>
              <th>Total</th>
              <th>Bukti</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr>
              <td colspan="6" class="empty">Pilih EMS terlebih dahulu</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
