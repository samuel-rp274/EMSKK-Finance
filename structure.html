<!DOCTYPE html>
<html lang="id">
<head>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/guard.css">
<script src="assets/js/guard.js" data-level="1"></script>
<script src="assets/js/config.js"></script>
<link rel="stylesheet" href="assets/css/sidebar.css">
<script src="assets/js/sidebar.js" defer></script>
<link rel="stylesheet" href="assets/css/structure.css">
<script src="assets/js/structure.js" defer></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMSKK Organizational Structure</title>
<link rel="icon" href="assets/images/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="blob top-left"></div>
  <div class="blob bottom-right"></div>

  <div class="container">

    <div class="card">
      <div class="card-header-icon"><i data-lucide="network"></i></div>
      <h1><span class="white">EMSKK</span> <span class="gradient">ORGANIZATIONAL STRUCTURE</span></h1>
      <div class="subtitle">EMS KotaKita — realtime data from system</div>
      <div class="info-text" id="infoText">Fetching data from server, please wait...</div>
      <button class="refresh-btn" id="refreshBtn" onclick="refreshOrgChart()">
        <i data-lucide="refresh-cw"></i> Refresh untuk perbarui foto / jabatan
      </button>
    </div>

    <div id="loadingState" class="loading-state">
      <i data-lucide="loader-circle"></i>
      loading the organizational structure...
    </div>

    <div id="contentWrap" style="display:none;">

      <div class="section-block accent-blue">
        <div class="section-title"><i data-lucide="shield" style="color:var(--accent-sky);"></i> Petinggi &amp; Pengurus</div>
        <div class="section-sub">management &amp; administration</div>
        <div id="kepengurusanTree"></div>
      </div>

      <div class="section-block accent-green">
        <div class="section-title"><i data-lucide="stethoscope" style="color:var(--accent-emerald);"></i> Jabatan Non-Kepengurusan</div>
        <div class="section-sub">Probation → Trainee → Co. Ass → Dokter Umum → Dokter Spesialis</div>
        <div id="nonKepengurusanTiers"></div>
      </div>
    </div>
  </div>
  
  <div class="modal-backdrop" id="personModal" onclick="if(event.target===this) closePersonModal()">
    <div class="modal-card">
      <button class="modal-close" onclick="closePersonModal()"><i data-lucide="x"></i></button>
      <div class="modal-avatar" id="modalAvatar"></div>
      <div class="modal-name" id="modalName"></div>
      <div class="modal-jabatan" id="modalJabatan"></div>
      <div class="modal-divisi" id="modalDivisi"></div>
    </div>
  </div>
</body>
</html>
