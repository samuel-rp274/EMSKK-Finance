<!DOCTYPE html>
<html lang="id">
<head>
<script src="assets/js/config.js"></script>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/guard.css">
<script src="assets/js/guard.js" data-level="1"></script>
<link rel="stylesheet" href="assets/css/sidebar.css">
<script src="assets/js/sidebar.js" defer></script>
<link rel="stylesheet" href="assets/css/attendancelog.css">
<script src="assets/js/attendancelog.js" defer></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMSKK Attendance Overview</title>

<link rel="icon" href="assets/images/logo.png" type="image/png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css">
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="blob top-left"></div>
  <div class="blob bottom-right"></div>

  <div class="container">

    <div class="card main-card">
      <div class="card-header-icon">
        <i data-lucide="history"></i>
      </div>

      <h1><span class="white">EMSKK</span> <span class="gradient">ATTENDANCE OVERVIEW</span></h1>
      <div class="subtitle">Weekly working hours & duty summary</div>

      <div class="search-wrap">
        <select id="searchEMS"></select>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="stat-title">Total Jam Minggu Ini</div>
          <div class="stat-value" id="weekHours">0h</div>
        </div>

        <div class="stat">
          <div class="stat-title">Total Jam Bulan Ini</div>
          <div class="stat-value" id="monthHours">0h</div>
        </div>

        <div class="stat">
          <div class="stat-title">Waktu On Duty Terakhir</div>
          <div class="stat-value" id="topDuty" style="font-size: 14px; word-break: break-all; font-weight: 500; color: var(--text-secondary); margin-top: 14px;">-</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>No</th>
              <th>Nama</th>
              <th>Start</th>
              <th>Finish</th>
              <th>Durasi</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr>
              <td colspan="5" class="empty">Pilih EMS terlebih dahulu</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
